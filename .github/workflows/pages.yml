name: Check and publish Web Crawler

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crawler-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check reader JavaScript
        run: |
          node --check app.js
          node --check reader-core.js
          node --check crawler-motion.js
          node --check crawler-inspection.js
          node --check text-analysis.js
      - run: npm test
      - name: Stage the static page
        run: |
          mkdir -p dist
          cp index.html style.css app.js reader-core.js crawler-motion.js crawler-inspection.js text-analysis.js LICENSE THIRD_PARTY.txt .nojekyll dist/
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: false
      - name: Deploy verified page
        id: deployment
        uses: actions/deploy-pages@v4
