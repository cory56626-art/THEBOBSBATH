name: Verify Wildwake release
on:
  push:
    branches: [main]
    paths:
      - 'wildwake/**'
      - '.github/workflows/wildwake-verify.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runner
        run: npm install --no-save --package-lock=false playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify the shipped game and browser controls
        run: node wildwake/tests/browser-release.test.mjs
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wildwake-release-check
          path: |
            wildwake/tests/browser-release-results.json
            wildwake/tests/release-map.png
            wildwake/tests/release-game.png
          if-no-files-found: ignore
          retention-days: 7
