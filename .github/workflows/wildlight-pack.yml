name: Build Wildlight Bedrock pack

on:
  push:
    paths:
      - 'minecraft/wildlight-realism/**'
      - '.github/workflows/wildlight-pack.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: minecraft/wildlight-realism
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: minecraft/wildlight-realism/requirements.txt
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt
      - name: Build and validate Ultra
        run: python build.py --size 512 --jobs 2
      - uses: actions/upload-artifact@v4
        with:
          name: Wildlight-Realism-Ultra
          path: minecraft/wildlight-realism/dist/
          if-no-files-found: error
          retention-days: 30
