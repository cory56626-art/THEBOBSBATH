name: Windows Roblox Probe

on:
  push:
    paths:
      - ".github/workflows/windows-roblox-probe.yml"

jobs:
  roblox:
    runs-on: windows-11-arm
    timeout-minutes: 15
    steps:
      - name: System info
        shell: pwsh
        run: |
          Get-ComputerInfo | Select-Object WindowsProductName,WindowsVersion,OsArchitecture | Format-List
          Write-Host "PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE"
          Write-Host "USERNAME=$env:USERNAME"
          Write-Host "SESSIONNAME=$env:SESSIONNAME"

      - name: Try classic Roblox installer and capture log
        shell: pwsh
        continue-on-error: true
        run: |
          $url = "https://setup.rbxcdn.com/RobloxPlayerInstaller.exe"
          $installer = Join-Path $env:TEMP "RobloxPlayerInstaller.exe"
          Invoke-WebRequest -Uri $url -OutFile $installer
          try {
            $p = Start-Process -FilePath $installer -PassThru
            if (-not $p.WaitForExit(180000)) {
              Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
              Write-Host "ClassicInstallerTimeout=True"
            } else {
              Write-Host "ClassicInstallerExitCode=$($p.ExitCode)"
            }
          } catch {
            Write-Host "ClassicInstallerError=$($_.Exception.Message)"
          }
          Write-Host "=== Roblox installer log ==="
          $log = Get-ChildItem "$env:LOCALAPPDATA\Roblox\logs\RobloxPlayerInstaller_*.log" -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($log) {
            Write-Host "LOG=$($log.FullName)"
            Get-Content $log.FullName -Tail 250
          } else {
            Write-Host "No installer log found."
          }

      - name: Find Roblox in Microsoft Store
        shell: pwsh
        continue-on-error: true
        run: |
          winget --version
          winget source list
          winget search --id 9PMF91N3LZ3M --source msstore --accept-source-agreements

      - name: Install Roblox Windows Store app
        shell: pwsh
        continue-on-error: true
        run: |
          winget install --id 9PMF91N3LZ3M --source msstore --accept-source-agreements --accept-package-agreements --silent --disable-interactivity
          Write-Host "winget_exit=$LASTEXITCODE"

      - name: Inspect installed Roblox
        shell: pwsh
        run: |
          Write-Host "=== AppX ==="
          Get-AppxPackage *Roblox* -ErrorAction SilentlyContinue |
            Select-Object Name,PackageFullName,PackageFamilyName,InstallLocation,Architecture,Status | Format-List
          Write-Host "=== StartApps ==="
          Get-StartApps | Where-Object { $_.Name -like "*Roblox*" } | Format-List
          Write-Host "=== Classic files ==="
          Get-ChildItem "$env:LOCALAPPDATA\Roblox" -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match "RobloxPlayer.*\.exe$" } |
            Select-Object FullName,Length | Format-Table -AutoSize

      - name: Try launching Store Roblox
        shell: pwsh
        continue-on-error: true
        run: |
          $app = Get-StartApps | Where-Object { $_.Name -like "*Roblox*" } | Select-Object -First 1
          if (-not $app) {
            Write-Host "No Roblox StartApps entry found."
            exit 0
          }
          Write-Host "Launching $($app.Name) :: $($app.AppID)"
          try {
            Start-Process "explorer.exe" "shell:AppsFolder\$($app.AppID)"
            Start-Sleep -Seconds 20
            $p = Get-Process | Where-Object { $_.ProcessName -like "*Roblox*" }
            if ($p) {
              Write-Host "ROBLOX_PROCESS_ALIVE"
              $p | Select-Object ProcessName,Id,Path | Format-Table -AutoSize
            } else {
              Write-Host "Roblox process not observed after launch."
            }
          } catch {
            Write-Host "StoreLaunchError=$($_.Exception.Message)"
          }
