name: Windows Roblox Interactive

on:
  push:
    paths:
      - ".github/workflows/windows-roblox-probe.yml"

jobs:
  roblox:
    runs-on: windows-11-arm
    timeout-minutes: 15
    steps:
      - name: Install Roblox
        shell: pwsh
        continue-on-error: true
        run: |
          $installer = Join-Path $env:TEMP "RobloxPlayerInstaller.exe"
          Invoke-WebRequest -Uri "https://setup.rbxcdn.com/RobloxPlayerInstaller.exe" -OutFile $installer
          try {
            $p = Start-Process -FilePath $installer -PassThru
            $p.WaitForExit(90000) | Out-Null
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
          } catch {}
          $player = Get-ChildItem "C:\Program Files\Roblox\Versions" -Filter RobloxPlayerBeta.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($player) { Write-Host "ROBLOX_INSTALLED=$($player.FullName)" } else { Write-Host "ROBLOX_NOT_FOUND" }

      - name: Enable temporary RDP desktop
        id: rdp
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $bytes = New-Object byte[] 18
          [System.Security.Cryptography.RandomNumberGenerator]::Fill($bytes)
          $password = "Aa1!" + ([Convert]::ToBase64String($bytes).Replace("/","A").Replace("+","B").TrimEnd("="))
          $secure = ConvertTo-SecureString $password -AsPlainText -Force

          if (-not (Get-LocalUser -Name "RobloxAgent" -ErrorAction SilentlyContinue)) {
            New-LocalUser -Name "RobloxAgent" -Password $secure -PasswordNeverExpires -AccountNeverExpires
          }
          Add-LocalGroupMember -Group "Administrators" -Member "RobloxAgent" -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RobloxAgent" -ErrorAction SilentlyContinue

          Set-ItemProperty "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" -Name fDenyTSConnections -Value 0
          Set-ItemProperty "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name UserAuthentication -Value 1
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue
          Set-Service TermService -StartupType Automatic
          Start-Service TermService

          $out = Join-Path $env:TEMP "pinggy-out.txt"
          $err = Join-Path $env:TEMP "pinggy-err.txt"
          $args = @(
            "-o","StrictHostKeyChecking=no",
            "-o","UserKnownHostsFile=NUL",
            "-o","ServerAliveInterval=20",
            "-p","443",
            "-R0:localhost:3389",
            "tcp@free.pinggy.io"
          )
          $tunnel = Start-Process -FilePath "ssh.exe" -ArgumentList $args -RedirectStandardOutput $out -RedirectStandardError $err -PassThru
          Start-Sleep -Seconds 12

          $text = ((Get-Content $out -Raw -ErrorAction SilentlyContinue) + "`n" + (Get-Content $err -Raw -ErrorAction SilentlyContinue))
          Write-Host "Tunnel output captured."
          $match = [regex]::Match($text, 'tcp://([A-Za-z0-9.-]+):(\d+)')
          if (-not $match.Success) {
            Write-Host $text
            throw "Could not find Pinggy TCP endpoint"
          }
          $hostName = $match.Groups[1].Value
          $port = $match.Groups[2].Value

          @"
HOST=$hostName
PORT=$port
USERNAME=RobloxAgent
PASSWORD=$password
"@ | Set-Content "$env:RUNNER_TEMP\rdp-connection.txt"

          Write-Host "RDP_TUNNEL_READY"
          Write-Host "HOST=$hostName"
          Write-Host "PORT=$port"
          Write-Host "TUNNEL_PID=$($tunnel.Id)"

      - name: Upload private-ish connection bundle
        uses: actions/upload-artifact@v4
        with:
          name: rdp-connection
          path: ${{ runner.temp }}\rdp-connection.txt
          retention-days: 1

      - name: Keep Windows desktop alive
        shell: pwsh
        run: |
          Write-Host "Keeping the Windows runner alive for remote GUI control."
          Start-Sleep -Seconds 600
