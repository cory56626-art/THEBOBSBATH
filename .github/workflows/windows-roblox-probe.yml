name: Windows Roblox Desktop Probe

on:
  push:
    paths:
      - ".github/workflows/windows-roblox-probe.yml"

jobs:
  roblox:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Inspect Windows desktop sessions
        shell: pwsh
        run: |
          Write-Host "=== OS ==="
          Get-ComputerInfo | Select-Object WindowsProductName,WindowsVersion,OsArchitecture | Format-List
          Write-Host "ARCH=$env:PROCESSOR_ARCHITECTURE"
          Write-Host "USER=$env:USERNAME"
          Write-Host "SESSIONNAME=$env:SESSIONNAME"
          Write-Host "=== query user ==="
          query user 2>&1
          Write-Host "=== qwinsta ==="
          qwinsta 2>&1
          Write-Host "=== explorer ==="
          Get-Process explorer -ErrorAction SilentlyContinue | Select-Object Id,SessionId,ProcessName,Path | Format-Table -AutoSize

      - name: Download and install normal Roblox
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $installer = Join-Path $env:TEMP "RobloxPlayerInstaller.exe"
          Invoke-WebRequest -Uri "https://setup.rbxcdn.com/RobloxPlayerInstaller.exe" -OutFile $installer
          Write-Host "DOWNLOADED_ROBLOX_INSTALLER=$installer"
          Get-Item $installer | Select-Object FullName,Length | Format-List
          $p = Start-Process -FilePath $installer -PassThru
          if (-not $p.WaitForExit(120000)) {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }
          Write-Host "INSTALLER_EXIT=$($p.ExitCode)"
          Write-Host "=== Roblox player files ==="
          Get-ChildItem "C:\Program Files\Roblox\Versions" -Filter RobloxPlayerBeta.exe -Recurse -ErrorAction SilentlyContinue |
            Select-Object FullName,Length,LastWriteTime | Format-List
          Get-ChildItem "$env:LOCALAPPDATA\Roblox\Versions" -Filter RobloxPlayerBeta.exe -Recurse -ErrorAction SilentlyContinue |
            Select-Object FullName,Length,LastWriteTime | Format-List

      - name: Launch downloaded Roblox
        shell: pwsh
        continue-on-error: true
        run: |
          $player = Get-ChildItem "C:\Program Files\Roblox\Versions" -Filter RobloxPlayerBeta.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $player) {
            $player = Get-ChildItem "$env:LOCALAPPDATA\Roblox\Versions" -Filter RobloxPlayerBeta.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $player) {
            Write-Host "ROBLOX_PLAYER_NOT_FOUND"
            exit 0
          }
          Write-Host "ROBLOX_PLAYER=$($player.FullName)"
          $p = Start-Process -FilePath $player.FullName -ArgumentList "-app" -PassThru
          Write-Host "ROBLOX_PID=$($p.Id)"
          Start-Sleep -Seconds 20
          Get-Process RobloxPlayerBeta -ErrorAction SilentlyContinue |
            Select-Object Id,SessionId,ProcessName,Path,Responding | Format-List

      - name: Capture Windows screen
        shell: pwsh
        continue-on-error: true
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          $bounds = [System.Windows.Forms.SystemInformation]::VirtualScreen
          Write-Host "SCREEN=$($bounds.Width)x$($bounds.Height)"
          if ($bounds.Width -gt 0 -and $bounds.Height -gt 0) {
            $bmp = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
            $out = "$env:RUNNER_TEMP\windows-screen.png"
            $bmp.Save($out, [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose()
            $bmp.Dispose()
            Write-Host "SCREENSHOT=$out"
          }

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: windows-roblox-diagnostics
          path: |
            ${{ runner.temp }}\windows-screen.png
            C:\Users\runneradmin\AppData\Local\Roblox\logs\*.log
          if-no-files-found: ignore
          retention-days: 1
