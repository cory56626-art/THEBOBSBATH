name: Windows 11 Capability Probe

on:
  push:
    paths:
      - ".github/workflows/windows-roblox-probe.yml"

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check nested virtualization
        shell: pwsh
        run: |
          Get-ComputerInfo | Select-Object WindowsProductName,WindowsVersion,OsArchitecture,HyperVisorPresent | Format-List
          Get-CimInstance Win32_Processor |
            Select-Object Name,VirtualizationFirmwareEnabled,SecondLevelAddressTranslationExtensions,VMMonitorModeExtensions |
            Format-List
          Write-Host "=== systeminfo virtualization ==="
          systeminfo | Select-String -Pattern "Hyper-V|Virtualization|Second Level|VM Monitor"
          Write-Host "=== optional features ==="
          Get-WindowsOptionalFeature -Online -FeatureName Microsoft-Hyper-V-All,HypervisorPlatform,VirtualMachinePlatform -ErrorAction SilentlyContinue |
            Select-Object FeatureName,State | Format-Table -AutoSize
          Write-Host "=== hyper-v cmdlets ==="
          Get-Command Get-VM -ErrorAction SilentlyContinue | Format-List Name,Source
          Write-Host "=== qemu ==="
          Get-Command qemu-system-x86_64 -ErrorAction SilentlyContinue | Format-List Source
