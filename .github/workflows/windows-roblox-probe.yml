name: Windows 11 Runner Reboot Capability

on:
  push:
    paths:
      - ".github/workflows/windows-roblox-probe.yml"

jobs:
  probe:
    runs-on: windows-11-arm
    timeout-minutes: 10
    steps:
      - name: Inspect runner startup
        shell: pwsh
        run: |
          Write-Host "=== runner processes ==="
          Get-CimInstance Win32_Process |
            Where-Object { $_.Name -match 'Runner|Agent|run' -or $_.CommandLine -match 'Runner.Listener|Runner.Worker' } |
            Select-Object Name,ProcessId,ParentProcessId,ExecutablePath,CommandLine |
            Format-List
          Write-Host "=== services ==="
          Get-Service |
            Where-Object { $_.Name -match 'actions|runner|agent' -or $_.DisplayName -match 'actions|runner|agent' } |
            Select-Object Name,DisplayName,Status,StartType |
            Format-Table -AutoSize
          Write-Host "=== scheduled tasks ==="
          Get-ScheduledTask |
            Where-Object { $_.TaskName -match 'runner|agent|actions' -or $_.TaskPath -match 'runner|agent|actions' } |
            Select-Object TaskName,TaskPath,State |
            Format-Table -AutoSize
          Write-Host "=== startup ==="
          Get-CimInstance Win32_StartupCommand |
            Select-Object Name,Command,Location,User |
            Format-List
          Write-Host "=== runner dirs ==="
          Get-ChildItem C:\ -Directory -Force -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match 'actions|agent|runner' } |
            Select-Object FullName |
            Format-List
          Get-ChildItem D:\ -Directory -Force -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match 'actions|agent|runner' } |
            Select-Object FullName |
            Format-List
          Write-Host "=== BCD ==="
          bcdedit /enum "{current}"
