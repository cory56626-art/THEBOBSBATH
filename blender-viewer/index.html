<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Blender 3D Viewer</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0e1116; color: #eef2f7; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    #app { position: fixed; inset: 0; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    #topbar { position: fixed; left: 12px; right: 12px; top: 12px; z-index: 10; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .panel { background: rgba(10,13,18,.78); border: 1px solid rgba(255,255,255,.14); border-radius: 12px; padding: 9px 11px; backdrop-filter: blur(10px); }
    button, .fileButton { appearance: none; border: 1px solid rgba(255,255,255,.16); color: #fff; background: rgba(10,13,18,.86); border-radius: 10px; padding: 9px 11px; font: inherit; cursor: pointer; }
    .fileButton input { display: none; }
    #status { font-size: 13px; opacity: .85; }
    #drop { position: fixed; inset: 0; display: grid; place-items: center; z-index: 5; pointer-events: none; }
    #drop .card { background: rgba(10,13,18,.82); border: 1px solid rgba(255,255,255,.14); border-radius: 16px; padding: 18px 20px; text-align: center; max-width: 320px; }
    #drop strong { display: block; margin-bottom: 6px; }
    #drop small { opacity: .7; }
    body.loaded #drop { display: none; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="app"></div>

  <div id="topbar">
    <label class="fileButton">
      Choose GLB
      <input id="file" type="file" accept=".glb,model/gltf-binary" />
    </label>
    <button id="reset" disabled>Reset view</button>
    <button id="fullscreen">Fullscreen</button>
    <div id="status" class="panel">No model loaded</div>
  </div>

  <div id="drop">
    <div class="card">
      <strong>Open a Blender GLB</strong>
      <small>Tap “Choose GLB” and select scene.glb. Then drag to rotate, pinch to zoom, and use two fingers to pan.</small>
    </div>
  </div>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

    const app = document.getElementById("app");
    const fileInput = document.getElementById("file");
    const resetButton = document.getElementById("reset");
    const fullscreenButton = document.getElementById("fullscreen");
    const status = document.getElementById("status");

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0e1116);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    app.appendChild(renderer.domElement);

    const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.01, 100000);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.screenSpacePanning = true;

    scene.add(new THREE.HemisphereLight(0xffffff, 0x263142, 1.4));

    const key = new THREE.DirectionalLight(0xffffff, 2.0);
    key.position.set(4, -6, 8);
    scene.add(key);

    const rim = new THREE.DirectionalLight(0xbcd8ff, 1.0);
    rim.position.set(-5, 4, 5);
    scene.add(rim);

    const loader = new GLTFLoader();
    let model = null;

    function clearModel() {
      if (!model) return;
      scene.remove(model);
      model.traverse((obj) => {
        if (obj.geometry) obj.geometry.dispose?.();
        if (obj.material) {
          const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
          mats.forEach((mat) => {
            for (const value of Object.values(mat)) {
              if (value && value.isTexture) value.dispose?.();
            }
            mat.dispose?.();
          });
        }
      });
      model = null;
    }

    function fitToObject(object, margin = 1.3) {
      const box = new THREE.Box3().setFromObject(object);
      if (box.isEmpty()) return;

      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      const radius = Math.max(size.length() * 0.5, 0.001);

      const vFov = THREE.MathUtils.degToRad(camera.fov);
      const hFov = 2 * Math.atan(Math.tan(vFov / 2) * camera.aspect);
      const limitingFov = Math.min(vFov, hFov);
      const distance = (radius / Math.sin(limitingFov / 2)) * margin;

      const direction = new THREE.Vector3(1, -1.35, 0.8).normalize();
      camera.position.copy(center).add(direction.multiplyScalar(distance));
      camera.near = Math.max(distance / 1000, 0.001);
      camera.far = Math.max(distance * 100, 100);
      camera.updateProjectionMatrix();

      controls.target.copy(center);
      controls.minDistance = Math.max(radius * 0.08, 0.001);
      controls.maxDistance = radius * 80;
      controls.update();
    }

    function loadArrayBuffer(buffer, label) {
      status.textContent = "Loading " + label + "…";
      loader.parse(
        buffer,
        "",
        (gltf) => {
          clearModel();
          model = gltf.scene;
          scene.add(model);
          fitToObject(model);
          resetButton.disabled = false;
          document.body.classList.add("loaded");
          status.textContent = label;
        },
        (error) => {
          console.error(error);
          status.textContent = "Could not load model";
          alert("Could not load that GLB file.");
        }
      );
    }

    fileInput.addEventListener("change", async () => {
      const file = fileInput.files?.[0];
      if (!file) return;
      try {
        loadArrayBuffer(await file.arrayBuffer(), file.name);
      } catch (error) {
        console.error(error);
        status.textContent = "Could not read file";
      }
    });

    resetButton.addEventListener("click", () => {
      if (model) fitToObject(model);
    });

    fullscreenButton.addEventListener("click", async () => {
      try {
        if (!document.fullscreenElement) await document.documentElement.requestFullscreen?.();
        else await document.exitFullscreen?.();
      } catch {}
    });

    addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      if (model) fitToObject(model);
    });

    addEventListener("dragover", (event) => event.preventDefault());
    addEventListener("drop", async (event) => {
      event.preventDefault();
      const file = [...(event.dataTransfer?.files || [])].find((f) => f.name.toLowerCase().endsWith(".glb"));
      if (!file) return;
      loadArrayBuffer(await file.arrayBuffer(), file.name);
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
